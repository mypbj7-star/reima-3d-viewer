<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 제품 보기 · REIMA STUDIO</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#F3EEE6;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent}
#t{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:15px;font-weight:700;color:#2a2722;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12px;color:#6f6a62;pointer-events:none}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#6f6a62;font-size:14px}
</style>
</head>
<body>
<model-viewer id="mv" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="20deg" touch-action="pan-y" shadow-intensity="1" exposure="1.05" environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
<div id="t"></div>
<div id="hint">손가락이나 마우스로 돌려 보세요</div>
<div id="err">3D 모델을 불러올 수 없습니다.</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var m = q.get('m') || '';
  var mv = document.getElementById('mv');
  var err = function () { mv.style.display = 'none'; document.getElementById('hint').style.display = 'none'; document.getElementById('err').style.display = 'flex'; };
  if (!/^https:\/\/tigjrkyhvckhfkazttnu\.supabase\.co\/storage\/v1\/object\/(sign|public)\//.test(m)) { err(); return; }
  var bg = q.get('bg'); if (bg && /^#?[0-9a-fA-F]{6}$/.test(bg)) { document.body.style.background = bg.charAt(0) === '#' ? bg : '#' + bg; }
  var o = Number(q.get('o') || 0); if (o) mv.setAttribute('orientation', '0deg 0deg ' + o + 'deg');
  if (q.get('f') === '1') { mv.setAttribute('min-camera-orbit', '-75deg 25deg auto'); mv.setAttribute('max-camera-orbit', '75deg 100deg auto'); mv.removeAttribute('auto-rotate'); var held = 0, t0 = performance.now(); mv.addEventListener('pointerdown', function () { held = Date.now(); }); mv.addEventListener('touchstart', function () { held = Date.now(); }, { passive: true }); setInterval(function () { if (Date.now() - held < 8000) return; var th = 35 * Math.sin((performance.now() - t0) / 2200); mv.cameraOrbit = th.toFixed(1) + 'deg 75deg auto'; }, 60); }
  var t = q.get('t'); if (t) document.getElementById('t').textContent = t.slice(0, 60);
  if (q.get('ar') === '0') mv.removeAttribute('ar');
  mv.addEventListener('error', err);
  mv.setAttribute('src', m);
})();
</script>
</body>
</html>
